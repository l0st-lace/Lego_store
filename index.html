<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEGO</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cause:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <img class="header__img" src="./LEGO_logo.svg.png" alt="Логотип">
        <h1 class="header__title" >LEGO-store</h1>
    </header>
    <div class="things-to-buy">
        <div class="Minecraft">

            <div class="products__line">
                <div class="line__card line__card--M">
                    <div class="card__name">Столкновение с Варденом</div>
                    <img class="card__img" src="./minecraft-warden.webp" alt="набор лего">
                    <span class="card__price" >Цена: 1699р</span>

                    <div class="card__btn-holder">
                        <button class="btn minBtn" price="-1699">-</button>
                        <button class="btn" price="1699" number = "0" amount="0" >+</button>
                    </div>
                </div>

                <div class="line__card line__card--M">
                    <div class="card__name">Дракон Эндера и Корабль</div>
                    <img class="card__img" src="./minecraft-dragon.webp" alt="набор лего">
                    <span class="card__price" >Цена: 9499р</span>

                    <div class="card__btn-holder">
                        <button class="btn minBtn" price="-9499">-</button>
                        <button class="btn" price="9499" number = "1" amount="0" >+</button>
                    </div>
                </div>

                <div class="line__card line__card--M">
                    <div class="card__name">Черепаший пляжный домик</div>
                    <img class="card__img" src="./minecraft-turtle.webp" alt="набор лего">
                    <span class="card__price" >Цена: 2999р</span>

                    <div class="card__btn-holder">
                        <button class="btn minBtn" price="-2999">-</button>
                        <button class="btn" price="2999" number = "2" amount="0" >+</button>
                    </div>
                </div>

                <div class="line__card line__card--M">
                    <div class="card__name">Лягушачий дом</div>
                    <img class="card__img" src="./minecraft-frog.webp" alt="набор лего">
                    <span class="card__price" >Цена: 5999р</span>

                    <div class="card__btn-holder">
                        <button class="btn minBtn" price="-5999">-</button>
                        <button class="btn" price="5999" number = "3" amount="0" >+</button>
                    </div>
                </div>
            </div>


            <div class="products__line products__line--down">
                <div class="line__card line__card--M">
                    <div class="card__name">Форпост мародеров</div>
                    <img class="card__img" src="./minecraft-ravanger.webp" alt="набор лего">
                    <span class="card__price" >Цена: 6999р</span>

                    <div class="card__btn-holder">
                        <button class="btn minBtn" price="-6999">-</button>
                        <button class="btn" price="6999" number = "4" amount="0" >+</button>
                    </div>
                </div>

                <div class="line__card line__card--M">
                    <div class="card__name">На пиратском корабле</div>
                    <img class="card__img" src="./minecraft-boat.webp" alt="набор лего">
                    <span class="card__price" >Цена: 1799р</span>

                    <div class="card__btn-holder">
                        <button class="btn minBtn" price="-1799">-</button>
                        <button class="btn" price="1799" number = "5" amount="0" >+</button>
                    </div>
                </div>

                <div class="line__card line__card--M">
                    <div class="card__name">Битва с Визером</div>
                    <img class="card__img" src="./minecraft-viser.webp" alt="набор лего">
                    <span class="card__price" >Цена: 6799р</span>

                    <div class="card__btn-holder">
                        <button class="btn minBtn" price="-6799">-</button>
                        <button class="btn" price="6799" number = "6" amount="0" >+</button>
                    </div>
                </div>

                <div class="line__card line__card--M">
                    <div class="card__name">Нападение на деревню</div>
                    <img class="card__img" src="./minecraft-film.webp" alt="набор лего">
                    <span class="card__price" >Цена: 6399р</span>

                    <div class="card__btn-holder">
                        <button class="btn minBtn" price="-6399">-</button>
                        <button class="btn" price="6399" number = "7" amount="0" >+</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="currentValue">0</div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
