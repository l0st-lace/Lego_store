<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picnic</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cause:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <img class="header__img" src="./logo.png" alt="Логотип">
        <h1 class="header__title" >Picnic</h1>
    </header>
    <div class="things-to-buy">
        <div class="products">
            <div class="products__line">
                <div class="line__card">
                    <div class="card__name">Стейк из говядины</div>
                    <img class="card__food-img" src="./steak.jpg" alt="Стейк">
                    <div class="card__btn-hold">
                        <button class="btn" price="-1">-</button>
                        <button class="btn" price="1">+</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="currentPrice">0</div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
