<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picnic</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cause:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <img class="img" src="./img.jpg" alt="">
        <h1 class="title" >Picnic</h1>
        <h2 class="title title-small" >tasty and healthy food</h2>
    </header>
    <div class="buy">
        <div class="line">
            <div class="card">
                <div class="name">Pizza Pepperoni</div>
                <img class="food-img" src="./pizza.jpg" alt="">
            </div>
        </div>
        <button price="-1">+</button>
        <button price="2">+</button>
        <div class="currentPrice">0</div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
