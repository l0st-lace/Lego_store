<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picnic</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cause:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <img class="header__img" src="./LEGO_logo.svg.png" alt="Логотип">
        <h1 class="header__title" >LEGO-store</h1>
    </header>
    <div class="things-to-buy">

        <div class="products">

            <div class="products__line">

                <div class="line__card">
                    <div class="card__name">Стейк из говядины</div>
                    <img class="card__food-img" src="./beef.jpg" alt="Стейк">
                    <span class="card__price" >Цена: 500р</span>

                    <div class="card__btn-holder">
                        <button class="btn" price="-500">-</button>
                        <button class="btn" price="500">+</button>
                    </div>
                </div>

                <div class="line__card">
                    <div class="card__name">Стейк из говядины</div>
                    <img class="card__food-img" src="./beef.jpg" alt="Стейк">
                    <span class="card__price" >Цена: 500р</span>

                    <div class="card__btn-holder">
                        <button class="btn" price="-500">-</button>
                        <button class="btn" price="500">+</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="currentValue">0</div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
